name: Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: container-registry.br-se1.magalu.cloud
  IMAGE_NAME: cloud-application-php
  PHP_VERSION: '8.2'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: orders
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql
          tools: composer

      - name: Instalar dependências
        run: composer install --prefer-dist --no-progress

      - name: Executar testes
        env:
          DATABASE_URL: pgsql://postgres:postgres@localhost:5432/orders
        run: |
          chmod +x vendor/bin/phpunit
          ./vendor/bin/phpunit

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.MGC_REGISTRY_USER }}
          password: ${{ secrets.MGC_REGISTRY_PASSWORD }}

      - name: Build e Push
        run: |
          BASE="${{ env.REGISTRY }}/${{ secrets.MGC_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}"
          docker build -t $BASE:${{ github.sha }} -t $BASE:latest .
          docker push $BASE:${{ github.sha }}
          docker push $BASE:latest

      - name: Deploy no Kubernetes
        run: |
          echo "${{ secrets.MGC_KUBECONFIG }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml
          
          # Criar Secrets com --dry-run para não falhar se já existirem
          kubectl create secret docker-registry registry-secret \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.MGC_REGISTRY_USER }} \
            --docker-password=${{ secrets.MGC_REGISTRY_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -
            
          kubectl create secret generic db-secret \
            --from-literal=url="${{ secrets.MGC_DATABASE_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Substituição segura de variáveis no YAML
          sed -i 's|${MGC_REGISTRY_NAME}|'"${{ secrets.MGC_REGISTRY_NAME }}"'|g' k8s/app.yaml
          sed -i 's|${IMAGE_TAG}|'"${{ github.sha }}"'|g' k8s/app.yaml
          
          kubectl apply -f k8s/app.yaml
          kubectl rollout status deployment/cloud-application