services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=pgsql://orders:orders@db:5432/orders
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 5s
      retries: 5